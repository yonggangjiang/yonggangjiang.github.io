extStatus, error);\r\n    callback(null); // handle the error case\r\n  });\r\n}\r\n\r\nfunction updateTable() {\r\n  let table = document.getElementById(\"myTable\");\r\n  table.innerHTML = ''; // Clear existing table\r\n\r\n  console.log(variables)\r\n\r\n  let undefinedKeys = Array.from(values.keys()).filter(k =\u003e values.get(k) === \"undefined\");\r\n\r\n  if (undefinedKeys.length \u003e 2) {\r\n    table.innerText = \"    Please check at most 2 keys as undefined!    \";\r\n  } \r\n  else if (undefinedKeys.length === 1) {\r\n    let header = document.createElement('tr');\r\n    header.innerHTML = `\u003cth\u003e\\\\ ${undefinedKeys[0]}\u003c/th\u003e` + variables[undefinedKeys[0]].split(',').map(x =\u003e `\u003cth\u003e${x}\u003c/th\u003e`).join('');\r\n    table.appendChild(header);\r\n\r\n    let row = document.createElement('tr');\r\n    row.innerHTML = '\u003cth\u003e\u003c/th\u003e' + variables[undefinedKeys[0]].split(',').map(x =\u003e {\r\n      let fixedValues = new Map(values);\r\n      fixedValues.set(undefinedKeys[0], x);\r\n      return `\u003ctd\u003e${getResults(fixedValues)}\u003c/td\u003e`;\r\n    }).join('');\r\n    table.appendChild(row);\r\n  } \r\n  else if (undefinedKeys.length === 0) {\r\n      let row = document.createElement('tr');\r\n      let data = document.createElement('td');\r\n\r\n        getResults(values, function(result) {\r\n          if (result) {\r\n            data.innerHTML = `$$${result}$$`;\r\n            MathJax.typeset()\r\n          } else {\r\n            data.innerHTML = \"No match found or error occurred\";\r\n          }\r\n        });\r\n\r\n      row.appendChild(data);\r\n      table.appendChild(row);\r\n  }\r\n  else {\r\n    let header = document.createElement('tr');\r\n    header.innerHTML = `\u003cth\u003e${undefinedKeys[1]} \\\\ ${undefinedKeys[0]}\u003c/th\u003e` + variables[undefinedKeys[0]].split(',').map(x =\u003e `\u003cth\u003e${x}\u003c/th\u003e`).join('');\r\n    table.appendChild(header);\r\n\r\n    variables[undefinedKeys[1]].split(',').forEach((model) =\u003e {\r\n      let row = document.createElement('tr');\r\n      row.innerHTML = `\u003cth\u003e${model}\u003c/th\u003e` + variables[undefinedKeys[0]].split(',').map(x =\u003e {\r\n        let fixedValues = new Map(values);\r\n        fixedValues.set(undefinedKeys[0], x);\r\n        fixedValues.set(undefinedKeys[1], model);\r\n        return `\u003ctd\u003e${getResults(fixedValues)}\u003c/td\u003e`;\r\n      }).join('');\r\n      table.appendChild(row);\r\n    });\r\n  }\r\n}\r\n\r\n\r\n\r\n  function setupButtons(variable) {\r\n    let buttons = document.getElementById(variable + 'Buttons');\r\n    values.set(variable, document.querySelector(`input[name=\"${variable}\"]:checked`).value);\r\n    buttons.addEventListener('change', () =\u003e {\r\n      values.set(variable, document.querySelector(`input[name=\"${variable}\"]:checked`).value);\r\n      updateTable();\r\n    });\r\n  }\r\n  function updateDebug() {\r\n    let debugText = '';\r\n    for (let variable of values.keys()) {\r\n      debugText += `${variable} = ${values.get(variable)}, `;\r\n    }\r\n    document.getElementById('debug').innerText = debugText;\r\n  }\r\n\r\n\u003c/script\u003e\r\n\u003cp\u003e\r\n\r\n\r\n\r\n\r\n\r\n\r\n\u003cdiv class=\"button-group\" id=\"problemsButtons\"\u003e\r\n  \r\n    \u003cinput type=\"radio\" id=\"problemsMinVertexCut\" name=\"problems\" value=\"MinVertexCut\" checked\u003e\r\n    \u003clabel for=\"problemsMinVertexCut\"\u003eMinVertexCut\u003c/label\u003e\r\n  \r\n    \u003cinput type=\"radio\" id=\"problemsundefined\" name=\"problems\" value=\"undefined\" \u003e\r\n    \u003clabel for=\"problemsundefined\"\u003eundefined\u003c/label\u003e\r\n  \r\n\u003c/div\u003e\r\n\r\n\u003cscript\u003e\r\n  setupButtons( \"problems\" );\r\n\u003c/script\u003e\r\n\n\u003cbr\u003e\u003c/p\u003e",
