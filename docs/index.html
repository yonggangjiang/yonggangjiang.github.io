            "description": "\u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2405.00832\"\u003eTeaching Algorithm Design: A Literature Review\u003c/a\u003e\u003c/p\u003e\n\u003ch1 id=\"potential-research-topics\"\u003ePotential Research Topics\u003c/h1\u003e\n\u003ch2 id=\"dynamic-vertex-connectivity\"\u003eDynamic Vertex Connectivity\u003c/h2\u003e\n\u003ch3 id=\"for-very-small-connectivity-subpolynomial\"\u003eFor very small connectivity (subpolynomial)\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2004.07650\"\u003eFully Dynamic s-t Edge Connectivity in Subpolynomial Time\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2210.13739\"\u003eDeterministic Small Vertex Connectivity in Almost Linear Time\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"for-larger-connectivity-that-requires-reduction-to-max-flow\"\u003eFor larger connectivity that requires reduction to max-flow\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2212.06315\"\u003eDynamic Maxflow via Dynamic Interior Point Methods\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"tsp\"\u003eTSP\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://arxiv.org/pdf/1802.01242\"\u003eFaster Approximations for Metric-TSP via Linear Programming\u003c/a\u003e, reduction from fraction to approximate\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://simons.berkeley.edu/talks/omri-weinstein-hebrew-u-columbia-u-2023-09-22\"\u003eTalk by Omri Weinstein\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2211.04994\"\u003eA Nearly Time-Optimal Distributed Approximation of Minimum Cost k-Edge-Connected Spanning Subgraph\u003c/a\u003e\u003c/p\u003e",

            "description": "\u003ch1 id=\"home\"\u003eHome\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eWelcome to Yonggang\u0026rsquo;s Wiki!\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis is a page constructed by \u003ca href=\"https://jyg94.github.io/\"\u003eme\u003c/a\u003e. I use this wiki to write down some important or newly learned math (especially in \u003ca href=\"https://en.wikipedia.org/wiki/Theoretical_computer_science\"\u003eTheoretical Computer Science\u003c/a\u003e) knowledge that comes to my mind. The current purpose is to make it convenient for me to reach theorems when I can\u0026rsquo;t remember them. I would also write proofs or ideas to get a deep understanding of newly learned knowledge, if time permits.\u003c/p\u003e\n\u003ch2 id=\"useful-links\"\u003eUseful links\u003c/h2\u003e\n\u003cdiv class=\"rounded border\" style=\"line-height:15px; background-color: #A7C1F2; border-radius: 5px; border-color: #AAAAAA; border-left-width: 2px; border-top-width: 2px;\"\u003e\r\n    \u003cdiv class=\"px-2 pt-2 pb-2 font-bold\"\u003e\r\n        \u003ca href=\"https://mathoverflow.net/questions/161159/maximum-size-of-intersecting-set-families\"\u003eMaximum number of sets with restricted intersection number\u003c/a\u003e\r\n    \u003c/div\u003e\r\n    \u003cdiv class=\"rounded border px-4 pt-2 pb-2\" style=\"background-color: white; border-left-width: 0px; border-right-width: 0px; border-bottom-width: 0px; border-color: #AAAAAA; border-top-right-radius: 0%; border-top-left-radius: 0%;\"\u003e\r\n        \u003cdiv\u003e\r\n\r\nFor fixed $k$ and $t$, as $n\\to\\infty$, the maximum number of $k$ elements subsets of $[n]$ that any two sets intersect in at most $t-1$ elements is roughly\r\n\\[\\binom{n}{t}/\\binom{k}{t}\\]\r\nSee *Erdos-Hanani conjecture* and *Rodl Nibble Method*.\r\n\u003c/div\u003e\r\n    \u003c/div\u003e\r\n\u003c/div\u003e\n\u003cdiv class=\"rounded border\" style=\"line-height:15px; background-color: #A7C1F2; border-radius: 5px; border-color: #AAAAAA; border-left-width: 2px; border-top-width: 2px;\"\u003e\r\n    \u003cdiv class=\"px-2 pt-2 pb-2 font-bold\"\u003e\r\n        \u003ca href=\"https://math.stackexchange.com/questions/1250622/largest-subset-with-no-arithmetic-progression\"\u003epreventing arithmatic progression\u003c/a\u003e\r\n    \u003c/div\u003e\r\n    \u003cdiv class=\"rounded border px-4 pt-2 pb-2\" style=\"background-color: white; border-left-width: 0px; border-right-width: 0px; border-bottom-width: 0px; border-color: #AAAAAA; border-top-right-radius: 0%; border-top-left-radius: 0%;\"\u003e\r\n        \u003cdiv\u003e\r\n\u003cp\u003e\u003ca href=\"https://en.wikipedia.org/wiki/Salem%E2%80%93Spencer_set\"\u003eSalem–Spencer set\u003c/a\u003e\u003c/p\u003e",
            "url": "https://yonggangjiang.github.io/docs/wiki/"
        },{
            "@type":"ListItem",
            "position":  3 ,
            "name": "Home",
            "description": "\u003ch1 id=\"d1-software-admin-guidance\"\u003eD1 Software Admin Guidance\u003c/h1\u003e\n\u003cp\u003eSte-by-step guidance on the responsibilities of a D1 software admin.\u003c/p\u003e\n\u003ch2 id=\"create-accounts-for-newcomers\"\u003eCreate Accounts for Newcomers\u003c/h2\u003e\n\u003cp\u003eUpon receiving the account-creating request e-mail from our secretary (usually the e-mail is sent to both the admin and the newcomer). There are three important pieces of information: the newcomer\u0026rsquo;s name, the newcomer\u0026rsquo;s current e-mail, and the newcomer\u0026rsquo;s rule (Ph.D. student? Vister? Postdoc?).\u003c/p\u003e\n\u003ch3 id=\"step-1-create-an-account-request\"\u003eStep 1: Create an account request.\u003c/h3\u003e\n\u003cp\u003eGo to \u003ca href=\"https://domino.mpi-inf.mpg.de/\"\u003ehttps://domino.mpi-inf.mpg.de/\u003c/a\u003e and click \u0026ldquo;Request a new account\u0026rdquo;. Then check the correct person, click \u0026ldquo;Proceed\u0026rdquo;, and a form will appear. There is only one place we need to change, which is \u0026ldquo;Email (Alias) Group(s)\u0026rdquo;, check \u0026ldquo;d1-phd\u0026rdquo; or \u0026ldquo;d1-postdocs\u0026rdquo; or \u0026ldquo;d1-students\u0026rdquo; or \u0026ldquo;d1-guest\u0026rdquo; according to the newcomer\u0026rsquo;s role (interns are in the category \u0026ldquo;d1-students\u0026rdquo;). Then click \u0026ldquo;Request a new account\u0026rdquo; and \u0026ldquo;Complete the request\u0026rdquo;.\u003c/p\u003e",

        }
